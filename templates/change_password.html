<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — CDAC Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-page); }
        .cp-wrapper { width: 100%; max-width: 420px; padding: 20px; }
        .cp-logo { text-align: center; margin-bottom: 28px; }
        .cp-logo i { font-size: 2.2rem; color: var(--color-primary); margin-bottom: 10px; }
        .cp-logo h1 { font-size: 1.35rem; margin: 0; }
        .cp-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); padding: 32px; box-shadow: var(--shadow-md); }
        .cp-msg { padding: 10px 14px; border-radius: 6px; font-size: 0.93rem; margin-bottom: 16px; display: none; }
        .cp-msg.error { background: #FFEBE6; color: #BF2600; }
        .cp-msg.success { background: #E3FCEF; color: #006644; }
        .cp-note { font-size: 0.88rem; color: var(--text-secondary); margin: 0 0 20px; text-align: center; }
    </style>
</head>

<body>
    <div class="cp-wrapper">
        <div class="cp-logo">
            <i class="fa-solid fa-key"></i>
            <h1>Change Your Password</h1>
        </div>
        <div class="cp-card">
            <p class="cp-note">For security, please set a new password{% if user_name %}, {{ user_name }}{% endif %}.</p>
            <form id="cpForm">
                <div class="app-form-group">
                    <label class="app-form-label">Current Password</label>
                    <input type="password" name="current_password" class="app-form-input"
                        placeholder="Current password" autocomplete="current-password" required>
                </div>
                <div class="app-form-group">
                    <label class="app-form-label">New Password</label>
                    <input type="password" name="new_password" class="app-form-input"
                        placeholder="At least 6 characters" autocomplete="new-password" required>
                </div>
                <div class="app-form-group">
                    <label class="app-form-label">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="app-form-input"
                        placeholder="Re-enter new password" autocomplete="new-password" required>
                </div>
                <div id="cpMsg" class="cp-msg"></div>
                <button type="submit" class="app-btn app-btn-primary app-btn-lg app-btn-block">Update Password</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('cpForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const current_password = this.current_password.value;
            const new_password = this.new_password.value;
            const confirm_password = this.confirm_password.value;
            const msg = document.getElementById('cpMsg');
            const btn = this.querySelector('button[type="submit"]');
            msg.style.display = 'none';

            if (new_password !== confirm_password) {
                msg.className = 'cp-msg error'; msg.textContent = 'New passwords do not match'; msg.style.display = 'block';
                return;
            }
            if (new_password.length < 6) {
                msg.className = 'cp-msg error'; msg.textContent = 'New password must be at least 6 characters'; msg.style.display = 'block';
                return;
            }

            btn.disabled = true; btn.innerHTML = '<span class="app-spinner"></span> Updating...';
            try {
                const res = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password, new_password })
                });
                const data = await res.json();
                if (data.success) {
                    msg.className = 'cp-msg success'; msg.textContent = 'Password updated. Redirecting...'; msg.style.display = 'block';
                    setTimeout(() => { window.location.href = data.redirect_url || '/'; }, 700);
                } else {
                    msg.className = 'cp-msg error'; msg.textContent = data.message || 'Failed to update password'; msg.style.display = 'block';
                    btn.disabled = false; btn.innerHTML = 'Update Password';
                }
            } catch (err) {
                msg.className = 'cp-msg error'; msg.textContent = 'Connection failed. Try again.'; msg.style.display = 'block';
                btn.disabled = false; btn.innerHTML = 'Update Password';
            }
        });
    </script>
</body>

</html>
