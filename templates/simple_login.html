<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CDAC Attendance</title>
    <meta name="theme-color" content="#0052CC">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/images/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/pwa.js" defer></script>
    <style>
        body {
            padding-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-page);
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo i {
            font-size: 2.5rem;
            color: var(--color-primary);
            margin-bottom: 12px;
        }

        .login-logo h1 {
            font-size: 1.43rem;
            margin: 0;
        }

        .login-logo p {
            font-size: 0.93rem;
            color: var(--text-secondary);
            margin: 4px 0 0;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-md);
        }

        .role-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .role-toggle label {
            flex: 1;
            text-align: center;
            padding: 8px 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.93rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .role-toggle input {
            display: none;
        }

        .role-toggle input:checked+label {
            border-color: var(--color-primary);
            background: #DEEBFF;
            color: var(--color-primary);
            font-weight: 600;
        }

        .login-error {
            background: #FFEBE6;
            color: #BF2600;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.93rem;
            margin-bottom: 16px;
            display: none;
        }

        .term-batch-list {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            max-height: 240px;
            overflow-y: auto;
        }

        .term-batch {
            border-bottom: 1px solid var(--border-color);
            padding: 10px 12px;
        }

        .term-batch:last-child { border-bottom: none; }

        .term-batch-head {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: .92rem;
        }

        .term-batch-head input { cursor: pointer; }

        /* The PIN box only appears once its batch is ticked, so an operator
           opening a single-batch terminal sees exactly one field. */
        .term-batch-pin {
            margin-top: 8px;
            display: none;
        }

        .term-batch.on .term-batch-pin { display: block; }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-logo">
            <i class="fa-solid fa-users-viewfinder"></i>
            <h1>CDAC Attendance</h1>
            <p>Face Recognition System</p>
        </div>

        <div class="login-card">
            <form id="loginForm">
                <div class="role-toggle">
                    <input type="radio" name="role" value="student" id="role-student" checked>
                    <label for="role-student"><i class="fa-solid fa-user-graduate"></i> Student</label>
                    <input type="radio" name="role" value="staff" id="role-staff">
                    <label for="role-staff"><i class="fa-solid fa-chalkboard-user"></i> Staff</label>
                    <input type="radio" name="role" value="terminal" id="role-terminal">
                    <label for="role-terminal"><i class="fa-solid fa-camera"></i> Terminal</label>
                </div>

                <!-- Student / Staff fields -->
                <div id="credFields">
                    <div class="app-form-group">
                        <label class="app-form-label" id="usernameLabel">Roll Number</label>
                        <input type="text" name="username" class="app-form-input" placeholder="Enter your roll number"
                            autocomplete="username">
                    </div>
                    <div class="app-form-group">
                        <label class="app-form-label">Password</label>
                        <input type="password" name="password" class="app-form-input" placeholder="Enter password"
                            autocomplete="current-password">
                    </div>
                </div>

                <!-- Terminal fields -->
                <div id="terminalFields" style="display:none;">
                    <div class="app-form-group">
                        <label class="app-form-label">Batches</label>
                        <p class="sub" style="margin:0 0 8px;font-size:.82rem;color:var(--text-secondary);">
                            Tick one batch, or several to run one camera for all of them.
                            Each batch needs its own PIN.
                        </p>
                        <div id="terminalBatchList" class="term-batch-list">
                            <p class="sub" style="margin:0;font-size:.86rem;">Loading batches…</p>
                        </div>
                    </div>
                </div>

                <div id="loginError" class="login-error"></div>

                <button type="submit" class="app-btn app-btn-primary app-btn-lg app-btn-block">
                    <span id="submitLabel">Log In</span>
                </button>

                <p style="text-align:center;margin:14px 0 0;font-size:.88rem;" id="forgotLink">
                    <a href="/forgot-password" style="color:var(--text-secondary);">Forgot password?</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        let terminalBatchesLoaded = false;

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        async function loadTerminalBatches() {
            if (terminalBatchesLoaded) return;
            const box = document.getElementById('terminalBatchList');
            try {
                const res = await fetch('/api/terminal/batches');
                const data = await res.json();
                if (data.batches && data.batches.length) {
                    box.innerHTML = data.batches.map(b => `
                        <div class="term-batch" data-course-id="${b.id}">
                            <label class="term-batch-head">
                                <input type="checkbox" class="term-batch-check" value="${b.id}">
                                <span>${escapeHtml(b.name)}</span>
                            </label>
                            <div class="term-batch-pin">
                                <input type="password" class="app-form-input term-pin"
                                       placeholder="PIN for ${escapeHtml(b.name)}"
                                       autocomplete="off" inputmode="numeric">
                            </div>
                        </div>`).join('');
                    box.querySelectorAll('.term-batch-check').forEach(function (cb) {
                        cb.addEventListener('change', function () {
                            const row = this.closest('.term-batch');
                            row.classList.toggle('on', this.checked);
                            if (this.checked) row.querySelector('.term-pin').focus();
                            else row.querySelector('.term-pin').value = '';
                        });
                    });
                    // One batch on the system: tick it so the common case is
                    // still "type the PIN and go".
                    if (data.batches.length === 1) {
                        const only = box.querySelector('.term-batch-check');
                        only.checked = true;
                        only.dispatchEvent(new Event('change'));
                    }
                    terminalBatchesLoaded = true;
                } else {
                    box.innerHTML = '<p class="sub" style="margin:0;padding:10px 12px;font-size:.86rem;">No terminal-enabled batches. Set a terminal PIN on a batch first.</p>';
                }
            } catch (e) {
                box.innerHTML = '<p class="sub" style="margin:0;padding:10px 12px;font-size:.86rem;">Failed to load batches.</p>';
            }
        }

        // Collect the ticked batches and their PINs.
        function terminalSelection() {
            const out = [];
            document.querySelectorAll('#terminalBatchList .term-batch.on').forEach(function (row) {
                out.push({
                    course_id: parseInt(row.dataset.courseId, 10),
                    pin: row.querySelector('.term-pin').value,
                    name: row.querySelector('.term-batch-head span').textContent
                });
            });
            return out;
        }

        // Switch fields + labels based on selected role
        document.querySelectorAll('input[name="role"]').forEach(function (r) {
            r.addEventListener('change', function () {
                const role = this.value;
                const credFields = document.getElementById('credFields');
                const terminalFields = document.getElementById('terminalFields');
                const label = document.getElementById('usernameLabel');
                const input = document.querySelector('input[name="username"]');
                const submitLabel = document.getElementById('submitLabel');

                if (role === 'terminal') {
                    credFields.style.display = 'none';
                    terminalFields.style.display = 'block';
                    submitLabel.textContent = 'Open Terminal';
                    loadTerminalBatches();
                } else {
                    credFields.style.display = 'block';
                    terminalFields.style.display = 'none';
                    submitLabel.textContent = 'Log In';
                    if (role === 'staff') { label.textContent = 'Username'; input.placeholder = 'Enter your username'; }
                    else { label.textContent = 'Roll Number'; input.placeholder = 'Enter your roll number'; }
                }
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const role = this.elements['role'].value;
            const errorDiv = document.getElementById('loginError');
            const btn = this.querySelector('button[type="submit"]');
            errorDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="app-spinner"></span> Please wait...';

            let endpoint, payload;
            if (role === 'terminal') {
                endpoint = '/api/terminal-login';
                const picked = terminalSelection();
                const fail = function (msg) {
                    errorDiv.textContent = msg;
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<span id="submitLabel">Open Terminal</span>';
                };
                if (!picked.length) { fail('Select at least one batch'); return; }
                const blank = picked.filter(b => !b.pin.trim());
                if (blank.length) { fail('Enter the PIN for ' + blank.map(b => b.name).join(', ')); return; }
                payload = { batches: picked.map(b => ({ course_id: b.course_id, pin: b.pin })) };
            } else {
                endpoint = role === 'staff' ? '/api/admin-login' : '/api/user-login';
                payload = { username: this.username.value, password: this.password.value };
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (data.success) {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Success!';
                    btn.classList.remove('app-btn-primary'); btn.classList.add('app-btn-success');
                    setTimeout(() => { window.location.href = data.redirect_url || '/'; }, 400);
                } else {
                    errorDiv.textContent = data.message || 'Invalid credentials';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<span id="submitLabel">' + (role === 'terminal' ? 'Open Terminal' : 'Log In') + '</span>';
                }
            } catch (error) {
                errorDiv.textContent = 'Connection failed. Please try again.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<span id="submitLabel">' + (role === 'terminal' ? 'Open Terminal' : 'Log In') + '</span>';
            }
        });
    </script>
</body>

</html>
