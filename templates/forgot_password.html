<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — CDAC Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/theme.js"></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-page); }
        .fp-wrapper { width: 100%; max-width: 420px; padding: 20px; }
        .fp-logo { text-align: center; margin-bottom: 28px; }
        .fp-logo i { font-size: 2.2rem; color: var(--color-primary); margin-bottom: 10px; }
        .fp-logo h1 { font-size: 1.35rem; margin: 0; }
        .fp-card { background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg); padding: 32px; box-shadow: var(--shadow-md); }
        .fp-msg { padding: 10px 14px; border-radius: 6px; font-size: 0.93rem; margin-bottom: 16px; display: none; }
        .fp-msg.error { background: #FFEBE6; color: #BF2600; }
        .fp-msg.success { background: #E3FCEF; color: #006644; }
        .fp-note { font-size: 0.88rem; color: var(--text-secondary); margin: 0 0 20px; text-align: center; }
        .fp-back { text-align: center; margin-top: 16px; font-size: 0.9rem; }
        .otp-input { letter-spacing: 8px; font-size: 1.3rem; text-align: center; font-weight: 600; }
    </style>
</head>

<body>
    <div class="fp-wrapper">
        <div class="fp-logo">
            <i class="fa-solid fa-unlock-keyhole"></i>
            <h1>Reset Your Password</h1>
        </div>

        <div class="fp-card">
            <!-- STEP 1: request a code -->
            <div id="step1">
                <p class="fp-note">Enter your roll number (students) or username/email (staff).
                    We'll email you a one-time code.</p>
                <div class="app-form-group">
                    <label class="app-form-label">Roll number / Username / Email</label>
                    <input type="text" id="identifier" class="app-form-input"
                        placeholder="e.g. 250840325001" autocomplete="username">
                </div>
                <div id="msg1" class="fp-msg"></div>
                <button class="app-btn app-btn-primary app-btn-lg app-btn-block" id="btn1"
                    onclick="requestCode()">Send reset code</button>
                <p class="fp-note" style="margin:14px 0 0;font-size:.82rem;">
                    Already have a code? <a href="#" onclick="showStep2();return false;">Enter it here</a>
                </p>
            </div>

            <!-- STEP 2: enter code + new password -->
            <div id="step2" style="display:none;">
                <p class="fp-note">Enter the 6-digit code from your email and choose a new password.</p>
                <div class="app-form-group">
                    <label class="app-form-label">Account</label>
                    <input type="text" id="identifier2" class="app-form-input" placeholder="Roll number / username">
                </div>
                <div class="app-form-group">
                    <label class="app-form-label">6-digit code</label>
                    <input type="text" id="otp" class="app-form-input otp-input" maxlength="6"
                        inputmode="numeric" placeholder="000000" autocomplete="one-time-code">
                </div>
                <div class="app-form-group">
                    <label class="app-form-label">New password</label>
                    <input type="password" id="newPw" class="app-form-input"
                        placeholder="At least 6 characters" autocomplete="new-password">
                </div>
                <div class="app-form-group">
                    <label class="app-form-label">Confirm new password</label>
                    <input type="password" id="newPw2" class="app-form-input"
                        placeholder="Re-enter new password" autocomplete="new-password">
                </div>
                <div id="msg2" class="fp-msg"></div>
                <button class="app-btn app-btn-primary app-btn-lg app-btn-block" id="btn2"
                    onclick="submitReset()">Set new password</button>
                <p class="fp-note" style="margin:14px 0 0;font-size:.82rem;">
                    <a href="#" onclick="showStep1();return false;">Request a new code</a>
                </p>
            </div>

            <div class="fp-back"><a href="/login">Back to login</a></div>
        </div>
    </div>

    <script>
        function show(id, cls, text) {
            const el = document.getElementById(id);
            el.className = 'fp-msg ' + cls;
            el.textContent = text;
            el.style.display = 'block';
        }
        function showStep1() {
            document.getElementById('step1').style.display = '';
            document.getElementById('step2').style.display = 'none';
        }
        function showStep2() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = '';
            const v = document.getElementById('identifier').value.trim();
            if (v) document.getElementById('identifier2').value = v;
        }

        async function requestCode() {
            const identifier = document.getElementById('identifier').value.trim();
            const btn = document.getElementById('btn1');
            if (!identifier) { show('msg1', 'error', 'Please enter your roll number or username'); return; }
            btn.disabled = true; btn.innerHTML = '<span class="app-spinner"></span> Sending...';
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });
                const data = await res.json();
                show('msg1', 'success', data.message || 'If that account exists, a code has been sent.');
                document.getElementById('identifier2').value = identifier;
                setTimeout(showStep2, 1500);
            } catch (e) {
                show('msg1', 'error', 'Connection failed. Try again.');
            } finally {
                btn.disabled = false; btn.innerHTML = 'Send reset code';
            }
        }

        async function submitReset() {
            const identifier = document.getElementById('identifier2').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const new_password = document.getElementById('newPw').value;
            const confirm = document.getElementById('newPw2').value;
            const btn = document.getElementById('btn2');

            if (!identifier || !otp) { show('msg2', 'error', 'Account and code are required'); return; }
            if (new_password !== confirm) { show('msg2', 'error', 'Passwords do not match'); return; }
            if (new_password.length < 6) { show('msg2', 'error', 'Password must be at least 6 characters'); return; }

            btn.disabled = true; btn.innerHTML = '<span class="app-spinner"></span> Updating...';
            try {
                const res = await fetch('/api/reset-password-otp', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, otp, new_password })
                });
                const data = await res.json();
                if (data.success) {
                    show('msg2', 'success', data.message || 'Password updated. Redirecting...');
                    setTimeout(() => { window.location.href = '/login'; }, 1500);
                } else {
                    show('msg2', 'error', data.message || 'Could not reset password');
                    btn.disabled = false; btn.innerHTML = 'Set new password';
                }
            } catch (e) {
                show('msg2', 'error', 'Connection failed. Try again.');
                btn.disabled = false; btn.innerHTML = 'Set new password';
            }
        }
    </script>
</body>

</html>
