name: Deploy to Private VM

on:
  push:
    branches: [ "main" ]

env:
  # Where the app lives on the runner host. Change this ONE line if the
  # deployment directory ever moves. $HOME resolves to the runner's user.
  APP_DIR: student

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Sync code to the live directory
      run: |
        set -e
        TARGET="$HOME/${APP_DIR}"
        mkdir -p "$TARGET"
        # No --delete: runtime data (attendance.db, student_photos/, .env,
        # certs, venv) lives only on the server and must survive a deploy.
        rsync -a \
          --exclude='.git' \
          --exclude='venv' \
          --exclude='.env' \
          --exclude='attendance.db' \
          --exclude='student_photos' \
          --exclude='backups' \
          ./ "$TARGET/"
        echo "Synced to $TARGET"

    - name: Install dependencies
      run: |
        set -e
        cd "$HOME/${APP_DIR}"
        if [ ! -d "venv" ]; then
          python3 -m venv venv
        fi
        ./venv/bin/pip install --quiet --upgrade pip
        ./venv/bin/pip install --quiet -r requirements.txt

    - name: Make shell scripts executable
      # git does not always preserve the exec bit; without this ./restart.sh
      # fails with "Permission denied" and the app is never restarted.
      # deploy/ holds install_service.sh, which is run by hand but still needs it.
      run: |
        chmod +x "$HOME/${APP_DIR}"/*.sh
        chmod +x "$HOME/${APP_DIR}"/deploy/*.sh 2>/dev/null || true

    - name: Apply database migrations
      # Deploying code does not change the schema. Every migration is
      # idempotent, so running them on each deploy is safe.
      run: |
        set -e
        cd "$HOME/${APP_DIR}"
        for m in migrate_phase1.py migrate_phase2.py migrate_phase3.py migrate_phase4.py migrate_phase5.py; do
          [ -f "$m" ] && ./venv/bin/python "$m" || true
        done

    - name: Restart the application
      # restart.sh hands over to systemctl when the unit is installed
      # (deploy/install_service.sh) and falls back to nohup otherwise.
      run: |
        set -e
        cd "$HOME/${APP_DIR}"
        ./restart.sh

    - name: Verify the app is serving
      # A restart that "succeeded" but left the app crash-looping should fail
      # the deploy, not pass it quietly. Give it time to load the face model.
      run: |
        cd "$HOME/${APP_DIR}"
        for i in $(seq 1 12); do
          code=$(curl -sk -o /dev/null -w '%{http_code}' -m 5 \
                 "https://127.0.0.1:${PORT:-8000}/api/system/status" || true)
          if [ "$code" = "200" ]; then
            echo "App is serving (HTTP 200) after $((i * 5))s"
            exit 0
          fi
          sleep 5
        done
        echo "::error::App did not return HTTP 200 within 60s"
        journalctl -u attendance -n 40 --no-pager 2>/dev/null || tail -n 40 app.log
        exit 1

    - name: Verify schema
      # Non-fatal: report problems without failing an otherwise good deploy.
      run: |
        cd "$HOME/${APP_DIR}"
        ./venv/bin/python check_db.py || echo "::warning::check_db.py reported schema problems"
