# logrotate config for the attendance app's file-based logs.
#
# Only needed on the nohup/start.sh path — under systemd the journal handles
# rotation itself (see journalctl --vacuum-size). Harmless to install anyway.
#
# Install with:
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/attendance
#   sudo sed -i "s|__APPDIR__|$HOME/student|" /etc/logrotate.d/attendance
#   sudo logrotate -d /etc/logrotate.d/attendance     # dry-run to verify
#
# Replace __APPDIR__ with the real path (the sed line above does it for you).

__APPDIR__/app.log
__APPDIR__/logs/*.log
{
    daily
    rotate 14
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    # The app holds the file open and appends to it, so rotating by rename
    # would leave it writing to the rotated inode. copytruncate copies the
    # contents away and truncates in place instead, which needs no restart.
    copytruncate
    su __USER__ __USER__
    create 0640 __USER__ __USER__
}
